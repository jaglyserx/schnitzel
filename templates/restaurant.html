<article class="review-card">
    <div class="review-card__header">
        <div>
            <p class="review-card__meta">$city$</p>
            <h3>$title$</h3>
        </div>
        <div class="score-badge" aria-label="Average score">
            <span>$average$</span>
            <small>/ 5</small>
        </div>
    </div>

    <dl class="facts">
        <div>
            <dt>Visited</dt>
            <dd>$visited$</dd>
        </div>
        <div>
            <dt>Reviewers</dt>
            <dd>$reviewers$</dd>
        </div>
        <div>
            <dt>Price</dt>
            <dd>$price$</dd>
        </div>
    </dl>

    $body$
</article>
